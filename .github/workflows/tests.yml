name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    name: 不调用模型的测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑测试（会自动建库，不调用模型、不花钱）
        run: python -m pytest -q
